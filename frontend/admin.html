<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduMatch KZ | Админ-панель</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/verification.css">
  <style>
    body { background: var(--bg); }
    .admin-page { max-width: 1180px; margin: 0 auto; padding: 36px 24px 64px; }
    .admin-header { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:20px; }
    .admin-header h1 { margin:0; }
    .admin-header p { margin:6px 0 0; color:var(--text2); }
    .admin-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .admin-controls select { background:var(--bg2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:9px; }
    .admin-metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:16px; }
    .admin-metric,.admin-block { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
    .admin-metric strong { display:block; color:var(--accent); font-size:1.6rem; }
    .admin-metric span { color:var(--text2); font-size:.82rem; }
    .admin-metric small { display:block; color:var(--accent); margin-top:5px; }
    .admin-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-bottom:12px; }
    .admin-nav { display:flex; gap:6px; overflow:auto; border-bottom:1px solid var(--border); margin-bottom:16px; }
    .admin-tab { border:0; border-bottom:2px solid transparent; background:transparent; color:var(--text2); padding:10px 14px; cursor:pointer; white-space:nowrap; }
    .admin-tab.active { color:var(--accent); border-bottom-color:var(--accent); }
    .admin-section { display:none; }
    .admin-section.active { display:block; }
    .admin-search { width:100%; box-sizing:border-box; background:var(--bg2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:12px; }
    .admin-block h2 { margin:0 0 14px; font-size:1rem; }
    .admin-row { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-top:1px solid var(--border); font-size:.86rem; }
    .admin-row strong { color:var(--accent); }
    .admin-table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; font-size:.82rem; }
    th,td { text-align:left; padding:10px 8px; border-top:1px solid var(--border); white-space:nowrap; }
    th { color:var(--text2); }
    .admin-error { color:#ef4444; padding:16px; background:rgba(239,68,68,.06); border:1px solid rgba(239,68,68,.25); border-radius:10px; }
    .admin-section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .admin-section-header h2 { margin:0; }
    .admin-actions-cell { white-space:normal !important; }
    .admin-actions-cell .btn { margin:2px; }
    .admin-badge { display:inline-block; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:600; }
    .admin-badge-admin { background:#eaf3ee; color:#2d6a4f; }
    .admin-badge-red { background:#fdecea; color:#d32f2f; }
    .admin-badge-green { background:#eaf3ee; color:#16a34a; }
    .admin-badge-yellow { background:#fef3c7; color:#92400e; }
    .admin-badge-gray { background:#f3f4f6; color:#6b7280; }
    .admin-source-history { display:flex; flex-direction:column; gap:8px; }
    .admin-source-history-item { padding:10px; background:var(--bg2); border-radius:8px; font-size:13px; display:flex; align-items:center; gap:8px; }
    .admin-source-history-item span { color:var(--text2); }
    .admin-row-banned { opacity:0.5; }
    .admin-modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px; }
    .admin-modal { background:var(--card); border:1px solid var(--border); border-radius:12px; max-width:680px; width:100%; max-height:85vh; overflow:auto; }
    .admin-modal-header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border); }
    .admin-modal-header h3 { margin:0; font-size:1rem; }
    .admin-modal-close { border:0; background:none; font-size:24px; cursor:pointer; color:var(--text2); }
    .admin-modal-body { padding:20px; }
    .admin-profile-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .admin-profile-grid div { padding:8px 12px; background:var(--bg2); border-radius:8px; font-size:13px; }
    .admin-form { display:flex; flex-direction:column; gap:12px; }
    .admin-form-grid label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--text2); font-weight:600; }
    .admin-form-grid input, .admin-form-grid select, .admin-form-grid textarea { background:var(--bg2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:9px 12px; font-size:13px; }
    .admin-form-grid input:focus, .admin-form-grid select:focus, .admin-form-grid textarea:focus { border-color:var(--accent); outline:none; }
    .admin-checkbox-label { flex-direction:row !important; align-items:center; gap:8px !important; }
    .admin-checkbox-label input { width:auto; }
    .admin-form-actions { display:flex; gap:8px; margin-top:8px; }
    .btn-xs { padding:8px 14px; font-size:13px; border-radius:6px; min-height:44px; }
    .btn-danger { background:#d32f2f; color:#fff; }
    .btn-danger:hover { background:#b71c1c; }
    .admin-new-password { text-align:center; padding:20px; }
    .admin-new-password code { display:block; padding:16px; background:var(--bg2); border:1px solid var(--border); border-radius:8px; font-size:18px; margin-bottom:12px; word-break:break-all; user-select:all; }
    .admin-spec-list { display:flex; flex-direction:column; gap:4px; max-height:200px; overflow:auto; }
    .admin-spec-item { display:flex; justify-content:space-between; padding:6px 10px; background:var(--bg2); border-radius:6px; font-size:12px; }
    .admin-spec-item small { color:var(--text-muted); }
    .admin-review-mini { padding:10px; background:var(--bg2); border-radius:8px; margin-bottom:8px; font-size:12px; }
    .admin-review-mini p { margin:4px 0 0; color:var(--text2); }
    .admin-toast { position:fixed; bottom:24px; right:24px; padding:12px 20px; border-radius:8px; color:#fff; font-size:13px; z-index:99999; transform:translateY(20px); opacity:0; transition:all .3s; }
    .admin-toast.show { transform:translateY(0); opacity:1; }
    .admin-toast-success { background:#22c55e; }
    .admin-toast-error { background:#d32f2f; }
    .admin-toast-info { background:#2563eb; }
    @media(max-width:700px) { .admin-page{padding:22px 14px}.admin-header{align-items:flex-start;flex-direction:column}.admin-metrics,.admin-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.admin-block{grid-column:1/-1}.admin-profile-grid{grid-template-columns:1fr}.admin-actions-cell{flex-direction:column}.admin-actions-cell .btn{margin:4px 0} }
  </style>
</head>
<body>
  <main class="admin-page">
    <header class="admin-header">
      <div><h1>Админ-панель</h1><p>Управление и статистика EduMatch KZ</p></div>
      <div class="admin-controls"><label>Период <select id="admin-days"><option value="7">7 дней</option><option value="30" selected>30 дней</option><option value="90">90 дней</option><option value="365">Год</option></select></label><button class="btn btn-ghost" id="admin-refresh">Обновить</button><a class="btn btn-primary" href="/">На сайт</a></div>
    </header>
    <nav class="admin-nav" aria-label="Разделы админ-панели">
      <button class="admin-tab active" data-admin-tab="overview">Обзор</button>
      <button class="admin-tab" data-admin-tab="applications">Заявки</button>
      <button class="admin-tab" data-admin-tab="users">Пользователи</button>
      <button class="admin-tab" data-admin-tab="universities">Вузы</button>
      <button class="admin-tab" data-admin-tab="reviews">Отзывы</button>
      <button class="admin-tab" data-admin-tab="audit">Аудит</button>
      <button class="admin-tab" data-admin-tab="verification">Документы</button>
      <button class="admin-tab" data-admin-tab="sources">Источники</button>
    </nav>
    <input class="admin-search" id="admin-search" type="search" placeholder="Поиск по текущему разделу..." aria-label="Поиск">
    <section id="admin-root"><div class="loading-state"><div class="spinner"></div></div></section>
  </main>
  <script src="js/security.js"></script>
  <script src="js/admin-session.js"></script>
  <script src="js/verification.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
